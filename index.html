<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CORRELATIVAS</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>
    <h1>BIENVENIDO A LOS GRAFOS DE CORRELATIVAS DE LAS CARRERAS DE LA FIE</h1>
    <div class="career-menu">
        <label for="career">Elija su carrera:</label>
        <select id="career">
            <option value="">--Elija su carrera--</option>
            <option value="ingenieria-informatica-2018">Ingeniería Informática 2018</option>
            <option value="otra-carrera">Otra carrera</option>
            <!-- Add more career options as needed -->
        </select>
        <button onclick="showGraphs()">Ver Disponibilidad de Grafo</button>
    </div>

    <div class="graph-list" id="graphList"></div>

    <script>
        function showGraphs() {
            var career = document.getElementById('career').value;
            var graphList = document.getElementById('graphList');
            
            if (career === "ingenieria-informatica-2018") {
                graphList.style.display = 'block';
                var enlace = document.createElement("a");
                enlace.href = `grafo.html?carrera=${career}`;
                enlace.textContent = "Ver Grafo";
                document.getElementById("graphList").appendChild(enlace);
            } else {
                alert('No hay grafos disponibles para su carrera');
                graphList.style.display = 'none';
            }
        }
    </script>
</body>
</html>
